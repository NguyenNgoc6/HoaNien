<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TABLE FRAGMENT -->
<div th:fragment="table">
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
            <tr>
                <th>Mã</th><th>Tên</th><th>Loại tài khoản</th><th>Vai trò</th><th>Email</th><th>Đăng nhập cuối</th><th>Kích hoạt</th><th style="text-align:right">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']}">
                <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                <td th:attr="data-key='name',data-value=${row['name']}" th:text="${row['name']}"></td>
                <td th:attr="data-key='type',data-value=${row['type']}">
                    <span class="cell-badge" th:classappend="${row['__typeStyle']}" th:text="${row['type']}"></span>
                </td>
                <td th:attr="data-key='role',data-value=${row['role']}">
                    <span class="cell-badge" th:classappend="${row['__roleStyle']}" th:text="${row['role']}"></span>
                </td>
                <td th:attr="data-key='email',data-value=${row['email']}" th:text="${row['email']}"></td>
                <td th:attr="data-key='lastLogin',data-value=${row['lastLogin']}" th:text="${row['lastLogin']}"></td>
                <td th:attr="data-key='status',data-value=${row['status']}">
                    <button type="button" class="btn-toggle" th:attr="data-id=${row['id']},data-value=${row['status']}">
                        <i th:if="${row['status'] == 'true'}" data-lucide="toggle-right" style="color:#C9A96E"></i>
                        <i th:unless="${row['status'] == 'true'}" data-lucide="toggle-left" style="color:#8B7355"></i>
                    </button>
                </td>
                <td style="text-align:right">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
                        <button th:if="${row['type'] == 'Nhân viên'}" class="btn-action btn-action-shield btn-permissions" th:attr="data-id=${row['id']},data-name=${row['name']},data-role=${row['role']}" title="Cấp quyền"><i data-lucide="shield"></i></button>
                        <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i data-lucide="pencil"></i></button>
                        <button class="btn-action btn-action-delete btn-delete" th:attr="data-id=${row['id']}"><i data-lucide="trash-2"></i></button>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="8" style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">Không có bản ghi nào</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORM FRAGMENT -->
<div th:fragment="form">
    <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
        <div class="adm-form-group"><label class="adm-form-label">Tên <span style="color:#B45309">*</span></label><input type="text" name="name" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Loại tài khoản</label>
            <select name="type" class="adm-form-select">
                <option value="Nhân viên">Nhân viên</option>
                <option value="Khách hàng">Khách hàng</option>
            </select>
        </div>
        <div class="adm-form-group"><label class="adm-form-label">Vai trò</label>
            <select name="role" class="adm-form-select">
                <option th:each="opt : ${formOptions['staffRoles']}" th:value="${opt}" th:text="${opt}"></option>
                <option th:each="opt : ${formOptions['guestRoles']}" th:value="${opt}" th:text="${opt}"></option>
            </select>
        </div>
        <div class="adm-form-group"><label class="adm-form-label">Email <span style="color:#B45309">*</span></label><input type="email" name="email" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Kích hoạt (true/false)</label><input type="text" name="status" class="adm-form-input"></div>
    </div>
</div>

</body>
</html>
