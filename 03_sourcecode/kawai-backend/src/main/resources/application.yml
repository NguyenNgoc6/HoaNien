spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 538898392088-lv7in7thft76gbj9dki3u6ko1itmnrda.apps.googleusercontent.com
            client-secret: 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
  datasource:
    url: jdbc:h2:mem:kawaidb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  sql:
    init:
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  thymeleaf:
    cache: false
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/statics/

server:
  port: 8080
