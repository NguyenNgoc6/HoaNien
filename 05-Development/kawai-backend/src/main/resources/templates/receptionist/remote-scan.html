<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 16px;
            text-align: center;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }
        .scanner-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #qr-reader {
            width: 100%;
            max-width: 500px;
            border: 2px dashed #475569;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .status-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            background: #1e293b;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .status-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .info {
            color: #3b82f6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
        }
        .btn:active {
            background: #2563eb;
        }
        #qr-reader__dashboard_section_csr button {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <i class="fa-solid fa-mobile-screen-button" style="color: #6366f1;"></i>
        <h1>Remote CCCD Scanner</h1>
    </div>

    <div class="scanner-container">
        <!-- Hidden input holding sessionId -->
        <input type="hidden" id="sessionId" th:value="${sessionId}" />

        <div id="scanner-view" style="width: 100%; max-width: 500px;">
            <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 16px;">
                Vui lòng hướng camera vào mã QR trên thẻ CCCD
            </p>
            <div id="qr-reader" style="width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);"></div>
        </div>

        <div id="result-view" style="display: none; width: 100%; max-width: 500px;">
            <div class="status-box">
                <div class="status-icon success">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h3 style="margin: 0 0 8px 0; color: #f8fafc;">Đã quét thành công!</h3>
                <p style="margin: 0; font-size: 14px; color: #94a3b8;">Dữ liệu đã được gửi về máy tính của bạn.</p>
                
                <button class="btn" onclick="resumeScanner()">Quét thẻ khác</button>
            </div>
        </div>

        <div id="error-view" style="display: none; width: 100%; max-width: 500px;">
            <div class="status-box">
                <div class="status-icon error">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
                <h3 style="margin: 0 0 8px 0; color: #f8fafc;">Lỗi kết nối</h3>
                <p id="error-msg" style="margin: 0; font-size: 14px; color: #94a3b8;">Không thể gửi dữ liệu về máy tính.</p>
                
                <button class="btn" onclick="resumeScanner()">Thử lại</button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        const sessionId = document.getElementById('sessionId').value;
        let isProcessing = false;

        function startScanner() {
            document.getElementById('scanner-view').style.display = 'block';
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'none';

            if (!sessionId) {
                showError("Session không hợp lệ. Vui lòng quét lại mã QR trên màn hình máy tính.");
                return;
            }

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            const config = { 
                fps: 10, 
                qrbox: {width: 250, height: 250}, 
                aspectRatio: 1.0,
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
            };

            // Khởi động Camera (ưu tiên camera sau)
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.warn("Lỗi camera sau:", err);
                // Fallback: Nếu lỗi NotReadableError, thử mở bất kỳ camera nào có sẵn mà không ép facingMode
                html5QrCode.start(
                    { facingMode: "user" }, // Fallback to front camera if back fails
                    config,
                    onScanSuccess,
                    onScanFailure
                ).catch(fallbackErr => {
                    console.error("Lỗi tất cả camera:", fallbackErr);
                    let errStr = fallbackErr.toString().toLowerCase();
                    if (errStr.includes("not supported") || errStr.includes("not allowed")) {
                        showError("Trình duyệt này đã chặn Camera (Thường do mở qua Zalo/Facebook). Vui lòng nhấn dấu ... và chọn 'Mở bằng trình duyệt' (Safari/Chrome) để quét!");
                    } else {
                        showError("Lỗi phần cứng Camera: " + fallbackErr + ". Vui lòng đóng các app Camera khác và tải lại trang.");
                    }
                });
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            console.log(`Scan result: ${decodedText}`);
            
            // Rung nhẹ điện thoại để báo hiệu quét thành công
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }

            // DO NOT PAUSE the camera, just hide the view logically.
            document.getElementById('scanner-view').style.display = 'none';

            fetch(`/api/v1/remote-scan/${sessionId}/submit`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ qrData: decodedText })
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('result-view').style.display = 'block';
                } else {
                    throw new Error("Lỗi phản hồi từ server");
                }
            })
            .catch(error => {
                console.error('Error submitting scan data:', error);
                showError("Mất kết nối với máy tính. Vui lòng kiểm tra mạng.");
            });
        }

        function resumeScanner() {
            isProcessing = false;
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
        }

        function onScanFailure(error) {
            // Ignore ongoing errors during scanning frames
        }

        function showError(msg) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'block';
            document.getElementById('error-msg').innerText = msg;
        }

        // Khởi động trình quét ngay khi load trang
        window.addEventListener('load', () => {
            startScanner();
        });

        // Giải phóng camera khi thoát hoặc F5 để tránh NotReadableError do kẹt phần cứng
        window.addEventListener('beforeunload', () => {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(e => console.log(e));
            }
        });
        window.addEventListener('pagehide', () => {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(e => console.log(e));
            }
        });
    </script>

<!-- RECEPTIONIST PROFILE MODAL -->
<div id="receptionistProfileModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 24px; border-radius: 8px; width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: 'Inter', sans-serif;">
        <h2 style="margin-top: 0; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; color: #111827; font-size: 1.25rem; font-weight: 600;">Hồ sơ Cá nhân</h2>
        
        <div style="display: flex; gap: 24px; margin-top: 16px;">
            <!-- Left col: Info -->
            <div style="flex: 1;">
                <div style="display: flex; align-items: center; margin-bottom: 16px;">
                    <div class="user-avatar" style="width: 64px; height: 64px; border-radius: 50%; background: #c19b6c; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-right: 16px; font-weight: bold;" th:text="${staffName != null && staffName.length() >= 2 ? staffName.substring(0, 2).toUpperCase() : 'NV'}">NV</div>
                    <div>
                        <h3 style="margin: 0; font-size: 18px; color: #111827;" th:text="${staffName != null ? staffName : 'Nhân viên'}">Nhân viên</h3>
                        <p style="margin: 4px 0 0 0; color: #6b7280; font-size: 14px;" th:text="${staffRole != null ? staffRole : 'Receptionist'}">Receptionist</p>
                    </div>
                </div>
                <div style="font-size: 14px; line-height: 1.6; color: #374151;">
                    <p style="margin: 4px 0;"><strong>Email:</strong> <span th:text="${currentEmployee != null ? currentEmployee.email : 'Chưa cập nhật'}"></span></p>
                    <p style="margin: 4px 0;"><strong>SĐT:</strong> <span th:text="${currentEmployee != null ? currentEmployee.phone : 'Chưa cập nhật'}"></span></p>
                    <p style="margin: 4px 0;"><strong>Giới tính:</strong> <span th:text="${currentEmployee != null ? currentEmployee.gender : 'Chưa cập nhật'}"></span></p>
                    <p style="margin: 4px 0;"><strong>CCCD:</strong> <span th:text="${currentEmployee != null ? currentEmployee.cccd : 'Chưa cập nhật'}"></span></p>
                </div>
            </div>

            <!-- Right col: Password -->
            <div style="flex: 1; border-left: 1px solid #e5e7eb; padding-left: 24px;">
                <h3 style="margin-top: 0; font-size: 16px; color: #111827;">Đổi mật khẩu</h3>
                <div style="margin-top: 12px;">
                    <label style="display: block; font-size: 13px; color: #4b5563; margin-bottom: 4px;">Mật khẩu mới</label>
                    <input type="password" id="receptionistNewPassword" placeholder="Nhập mật khẩu mới" style="width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 14px; margin-bottom: 8px;">
                    <button id="receptionistSavePasswordBtn" style="padding: 8px 16px; background: #c19b6c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; width: 100%;">Cập nhật ngay</button>
                    <div id="receptionistPasswordMsg" style="margin-top: 8px; font-size: 13px; display: none;"></div>
                </div>
            </div>
        </div>

        <div style="margin-top: 24px; text-align: right; border-top: 1px solid #e5e7eb; padding-top: 16px;">
            <button onclick="document.getElementById('receptionistProfileModal').style.display='none'" style="padding: 8px 16px; background: white; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; font-weight: 500;">Đóng</button>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const avatars = document.querySelectorAll('.sidebar-user, .user-profile-btn');
        avatars.forEach(avatar => {
            avatar.style.cursor = 'pointer';
            avatar.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                document.getElementById('receptionistProfileModal').style.display = 'flex';
                document.getElementById('receptionistNewPassword').value = '';
                document.getElementById('receptionistPasswordMsg').style.display = 'none';
            });
        });
        
        const modal = document.getElementById('receptionistProfileModal');
        if(modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        const saveBtn = document.getElementById('receptionistSavePasswordBtn');
        if (saveBtn) {
            saveBtn.addEventListener('click', function() {
                const newPwd = document.getElementById('receptionistNewPassword').value;
                const msg = document.getElementById('receptionistPasswordMsg');
                
                if (!newPwd || newPwd.trim() === '') {
                    msg.style.display = 'block';
                    msg.style.color = '#dc2626';
                    msg.innerText = 'Vui lòng nhập mật khẩu mới';
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerText = 'Đang lưu...';

                fetch('/api/staff/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newPassword: newPwd })
                })
                .then(res => res.json())
                .then(data => {
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Cập nhật ngay';
                    msg.style.display = 'block';
                    if (data.success) {
                        msg.style.color = '#16a34a';
                        msg.innerText = 'Đổi mật khẩu thành công!';
                        document.getElementById('receptionistNewPassword').value = '';
                    } else {
                        msg.style.color = '#dc2626';
                        msg.innerText = data.message || 'Có lỗi xảy ra';
                    }
                })
                .catch(err => {
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Cập nhật ngay';
                    msg.style.display = 'block';
                    msg.style.color = '#dc2626';
                    msg.innerText = 'Lỗi kết nối mạng';
                });
            });
        }
    });
</script>
</body>

</html>
